services:
  app:
    container_name: app
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:13
    env_file:
      - .env # better to use a separate env file for db credentials, but now this is only for simplicity and demo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: