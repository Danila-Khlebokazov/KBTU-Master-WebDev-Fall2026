name: bounty-hunters

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bounty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bounty}
      POSTGRES_DB: ${POSTGRES_DB:-bounty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    image: bounty-hunters-backend:latest
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bounty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bounty}
      POSTGRES_DB: ${POSTGRES_DB:-bounty}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
