name: expense-tracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expenses}
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: expense-tracker-backend:latest
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db # service name, resolved by Docker's embedded DNS
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-expenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expenses}
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
      APP_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  frontend:
    build: ./frontend
    image: expense-tracker-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

volumes:
  pgdata:

networks:
  frontend-net:
  backend-net:
